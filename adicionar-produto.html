<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prico — Adicionar produto</title>
  <style>
    :root { --green:#15803D; --amber:#b45309; }
    * { box-sizing:border-box; }
    body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; line-height:1.5;
      color:#1a1a1a; max-width:640px; margin:0 auto; padding:24px; }
    h1 { color:var(--green); font-size:1.4rem; margin-bottom:2px; }
    .sub { color:#666; font-size:.9rem; margin-top:0; }
    label { display:block; font-weight:600; margin-top:12px; font-size:.9rem; }
    input, select { width:100%; padding:11px; font-size:16px; border:1px solid #ccc; border-radius:9px; margin-top:4px; }
    .row2 { display:flex; gap:10px; }
    .row2 > div { flex:1; }
    .block { border:1px solid #eee; border-radius:10px; padding:8px 12px 12px; margin-top:12px; }
    .block .tag { font-size:.78rem; color:#888; text-transform:uppercase; letter-spacing:.5px; margin-top:6px; }
    button { padding:13px 18px; font-size:16px; font-weight:600; color:#fff; background:var(--green);
      border:0; border-radius:9px; cursor:pointer; margin-top:16px; }
    button.sec { background:#666; }
    button:disabled { opacity:.5; }
    #status { margin-top:12px; padding:12px; border-radius:10px; display:none; font-size:.95rem; }
    #status.ok { background:#f0f7f1; border-left:4px solid var(--green); display:block; }
    #status.no { background:#fff7ed; border-left:4px solid var(--amber); display:block; }
    #status.err { background:#fef2f2; border-left:4px solid #c0392b; display:block; }
    #msg { margin-top:12px; font-weight:600; }
    .ok2 { color:var(--green); } .err2 { color:#c0392b; }
    #form, #app { display:none; }
    .topbar { display:flex; justify-content:space-between; align-items:center; font-size:.85rem; color:#666; }
    .topbar button { margin:0; padding:6px 12px; font-size:.85rem; }
    h2 { font-size:.8rem; color:#888; text-transform:uppercase; letter-spacing:.5px; margin-top:26px; }
    .hist { list-style:none; padding:0; margin:0; font-size:.92rem; }
    .hist li { padding:5px 0; border-bottom:1px solid #eee; }
    .ean { color:#888; font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <h1>Adicionar produto — Prico</h1>
  <p class="sub">Cola o EAN do site do supermercado <b>ou</b> usa «Inserir sem EAN» (marcas próprias: Hacendado, Lidl…). Confirma os dados e adiciona à base.</p>

  <div id="login">
    <label>Email (conta de moderador)<input id="email" type="email" autocomplete="username" /></label>
    <label>Palavra-passe<input id="pass" type="password" autocomplete="current-password" /></label>
    <button id="entrar">Entrar</button>
    <div id="loginErr" class="err2" style="margin-top:8px"></div>
  </div>

  <div id="app">
    <div class="topbar">
      <span id="who"></span>
      <button class="sec" id="sair">Sair</button>
    </div>

    <label>EAN (código de barras) — cola e Enter
      <input id="ean" type="text" inputmode="numeric" placeholder="Cola o EAN aqui…" autofocus />
    </label>
    <div id="eanAviso" style="display:none;margin-top:6px;color:#b45309;font-size:.9rem">⚠️ Este código não confere — vê se algum número está trocado.</div>
    <button class="sec" id="semEan" style="margin-top:8px;padding:9px 14px;font-size:.9rem">✍️ Inserir sem EAN (à mão)</button>
    <div id="status"></div>

    <div id="form">
      <label style="border:1px dashed #cbd5e1;border-radius:10px;padding:10px;display:block;background:#f8fafc">
        ⚡ Atalho — COLAR aqui o título copiado da loja (separa em nome/marca/quantidade e limpa-se)
        <input id="titulo" type="text" placeholder="cola aqui e larga · ex.: Leite UHT Meio Gordo Mimosa 1 L" />
        <span style="display:block;margin-top:4px;color:#64748b;font-size:.85rem">Para escrever à mão, usa o campo <b>Nome</b> aqui em baixo.</span>
      </label>
      <label>Nome<input id="name" type="text" /></label>
      <div id="sugNome" style="display:none;margin:-4px 0 8px;padding:8px 10px;border-radius:8px;background:#f0f7f1;border-left:4px solid var(--green);font-size:.9rem"></div>
      <div class="row2">
        <div><label>Marca<input id="brand" type="text" /></label></div>
        <div><label>Quantidade<input id="qty" type="text" placeholder="1 L · 500 g · 4 x 200 ml" /></label></div>
      </div>
      <label>Categoria<select id="cat"></select></label>

      <label style="border:1px dashed #cbd5e1;border-radius:10px;padding:10px;display:block;background:#f8fafc">
        🖼️ Foto — no site da loja: botão direito na imagem → <b>Copiar imagem</b>, e depois COLAR aqui (Ctrl+V)
        <input id="fotoCola" type="text" placeholder="clica aqui e cola (Ctrl+V) — imagem ou link" />
        <span id="fotoEstado" style="display:block;margin-top:6px;color:#64748b;font-size:.85rem">Sem foto.</span>
        <div id="fotoTiras" style="display:none;gap:14px;margin-top:8px;align-items:flex-start">
          <figure id="fotoBoxAtual" style="display:none;margin:0;text-align:center">
            <img id="fotoAtualPrev" alt="" style="max-width:120px;max-height:120px;border-radius:8px;background:#fff;border:1px solid #e2e8f0" />
            <figcaption style="font-size:.78rem;color:#64748b;margin-top:4px">na Prico</figcaption>
          </figure>
          <figure id="fotoBoxNova" style="display:none;margin:0;text-align:center">
            <img id="fotoPrev" alt="" style="max-width:120px;max-height:120px;border-radius:8px;background:#fff;border:2px solid #16a34a" />
            <figcaption id="fotoNovaLegenda" style="font-size:.78rem;color:#16a34a;margin-top:4px">nova</figcaption>
          </figure>
        </div>
        <button type="button" id="fotoUsarOff" class="sec" style="display:none;margin-top:6px;padding:6px 12px;font-size:.85rem">Usar a foto do Open Food Facts</button>
        <button type="button" id="fotoTirar" class="sec" style="display:none;margin-top:6px;padding:6px 12px;font-size:.85rem">Remover foto</button>
      </label>

      <!-- Blocos de cadeia (preço + promoção). 2 e 3 são opcionais. -->
      <div class="block">
        <div class="tag">Cadeia 1</div>
        <div class="row2"><div><label>Cadeia<select id="chain1" class="chainsel"></select></label></div><div><label>Preço normal<input id="price1" placeholder="1,29" /></label></div></div>
        <div class="row2"><div><label>Promoção<input id="promo1" placeholder="0,99" /></label></div><div><label>Validade<input id="ends1" type="date" /></label></div></div>
      </div>
      <div class="block">
        <div class="tag">Cadeia 2 (opcional)</div>
        <div class="row2"><div><label>Cadeia<select id="chain2" class="chainsel"></select></label></div><div><label>Preço normal<input id="price2" placeholder="1,29" /></label></div></div>
        <div class="row2"><div><label>Promoção<input id="promo2" placeholder="0,99" /></label></div><div><label>Validade<input id="ends2" type="date" /></label></div></div>
      </div>
      <div class="block">
        <div class="tag">Cadeia 3 (opcional)</div>
        <div class="row2"><div><label>Cadeia<select id="chain3" class="chainsel"></select></label></div><div><label>Preço normal<input id="price3" placeholder="1,29" /></label></div></div>
        <div class="row2"><div><label>Promoção<input id="promo3" placeholder="0,99" /></label></div><div><label>Validade<input id="ends3" type="date" /></label></div></div>
      </div>

      <button id="add">＋ Adicionar à base</button>
      <div id="msg"></div>
    </div>

    <h2>Adicionados nesta sessão</h2>
    <ul id="hist" class="hist"></ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://hwhcmclmnpgpnwpuvvgo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_hYxgXG6cnoWpz8dHqiODtw_FwTlOMqN';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CATEGORIES = ['Mercearia','Fruta e legumes','Talho (carne)','Peixaria (peixe)','Charcutaria','Queijos','Laticínios e ovos','Bebidas vegetais','Iogurtes e sobremesas frescas','Padaria e pastelaria','Congelados','Refeições prontas','Bolachas e cereais','Snacks e aperitivos','Doçaria e chocolates','Águas','Refrigerantes e sumos','Café, chá e infusões','Bebidas alcoólicas e garrafeira','Higiene e beleza','Limpeza do lar','Bebé','Animais','Casa e bazar','Outra'];

    const deburr = (s) => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    const searchNorm = (n,b) => deburr((n||'')+' '+(b||'')).replace(/\s+/g,' ').trim();

    // Capitalização "à portuguesa": 1ª letra de cada palavra em maiúscula, mas
    // ligações (de, da, com, sem…) em minúscula, UHT/BIO em maiúsculas e as
    // unidades (g, kg, ml…) e quantidades (1L, 4x125g) intactas.
    const SMALLW=['de','da','do','das','dos','e','com','sem','a','o','os','as','em','para','ao','à','no','na','nos','nas'];
    const UNITW=['g','kg','mg','gr','ml','cl','dl','l','lt','un','und','unid','oz'];
    function titleCasePT(s){
      if(!s) return s;
      return s.trim().replace(/\s+/g,' ').split(' ').map((w,i)=>{
        if(/\d/.test(w)) return w;
        const d=deburr(w);
        if(UNITW.includes(d)) return w.toLowerCase();
        if(d==='uht') return 'UHT';
        if(d==='bio') return 'BIO';
        if(i>0 && SMALLW.includes(d)) return w.toLowerCase();
        return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
      }).join(' ');
    }
    function isAllLower(s){ const L=s.replace(/[^A-Za-zÀ-ÿ]/g,''); return L.length>0 && s===s.toLowerCase(); }
    function isAllUpper(s){ const L=s.replace(/[^A-Za-zÀ-ÿ]/g,''); return L.length>3 && s===s.toUpperCase(); }
    // Nome: só capitaliza se vier TODO em minúsculas/maiúsculas (senão respeita
    // as maiúsculas que já lá estão, ex. "Polpa De Tomate").
    function fixName(v){ v=(v||'').trim(); return (v && (isAllLower(v)||isAllUpper(v))) ? titleCasePT(v) : v; }
    const COUNTW=['un','unid','unidade','unidades','rolo','rolos','capsula','capsulas','saqueta','saquetas','dose','doses','ovo','ovos','pastilha','pastilhas'];
    function derivePackUnits(q){ if(!q) return null; const raw=deburr(q.trim()); if(!raw) return null; let pu=1,rest=raw; const pm=raw.match(/^(\d+)\s*[x*]\s*(.+)$/); if(pm){pu=parseInt(pm[1],10)||1;rest=pm[2].trim();} const mm=rest.match(/(\d+(?:[.,]\d+)?)\s*(ml|cl|dl|lt|l|kg|gr|g)\b/); if(mm) return pu>1?pu:null; const cm=rest.match(/(\d+)\s*([a-z]+)?/); if(cm){const w=cm[2]||''; if(!w||COUNTW.includes(w)){const t=(parseInt(cm[1],10)||1)*pu; return t>1?t:null;}} return pu>1?pu:null; }
    function parsePriceToCents(t){ if(t==null||t==='') return null; const limpo=String(t).replace(/[^0-9.,]/g,'').replace(',','.').trim(); const v=Number(limpo); return (isFinite(v)&&v>0)?Math.round(v*100):null; }



    /* O OFF guarda muitas vezes so a VARIANTE como nome ("Mini" nas Chips Ahoy,
       "Original" nas Pringles) — o produto real esta na marca. Um nome feito so
       destas palavras nao identifica nada, por isso nao se aceita a sugestao e
       escreve-se o nome a mao. */
    const SO_VARIANTE = new Set(['mini','light','original','natural','classico','classic','zero','extra','maxi','bio','integral','grande','pequeno','familiar','tradicional','forte','suave','doce','salgado','magro','meio','gordo','sabor','plus','pro','max','fresh','soft','duo','multi','super','novo','nova','especial','premium','gold','style','edition','pack','the']);
    function nomeSoVariante(n){
      const ws = deburr(n).split(/[^a-z0-9]+/).filter(w=>w.length>=2 && !/^[0-9]+$/.test(w));
      if(ws.length===0 || ws.length>3) return false;
      return ws.every(w=>SO_VARIANTE.has(w));
    }




    /* A caixa da sugestão TEM de ser limpa em todos os recomeços. Só era limpa
       dentro do proporNomeMelhor(), que só corre quando o produto JÁ existe —
       por isso num produto NOVO ficava lá a sugestão do produto anterior. */
    function limparSugestaoNome(){
      const cx = $('sugNome');
      if (cx) { cx.style.display = 'none'; cx.innerHTML = ''; }
    }

    /* Compara o nome guardado com o melhor que o OFF tem (ja traduzido) e, se for
       diferente, oferece-o a um clique. Serve sobretudo para arrumar os nomes
       antigos que ficaram em espanhol ou so com a variante ("Mini", "Light"). */
    async function proporNomeMelhor(ean, nomeAtual){
      const cx=$('sugNome'); if(!cx) return;
      limparSugestaoNome();
      try{
        const off=await offLookup(ean);
        if(!off || !off.name) return;
        const igual = deburr(off.name).replace(/[^a-z0-9]/g,'') === deburr(nomeAtual||'').replace(/[^a-z0-9]/g,'');
        if(igual) return;
        cx.innerHTML = '✨ O Open Food Facts tem: <b>'+off.name+'</b>'
          + (off.traduzido ? ' <span style="color:#64748b">(traduzido automaticamente)</span>' : '')
          + (off.ingles ? ' <span style="color:#b45309">(em inglês — convém traduzir)</span>' : '')
          + ' <button type="button" id="usarSug" class="sec" style="margin-left:8px;padding:4px 10px;font-size:.85rem">Usar este nome</button>';
        cx.style.display='block';
        $('usarSug').addEventListener('click', ()=>{
          $('name').value = off.name;
          if(off.brand && !$('brand').value.trim()) { $('brand').value = off.brand; normalizarMarca(); }
          if(off.quantity && !$('qty').value.trim()) $('qty').value = off.quantity;
          cx.style.display='none';
        });
      }catch(e){ /* sem sugestao, segue */ }
    }

    /* --- FOTO: colar a imagem copiada do site da loja ---------------------
       Dois caminhos: (a) "Copiar imagem" poe os BYTES na area de transferencia
       -> enviam-se para o Storage da Prico (ficam nossos, nao dependem do site
       da loja); (b) "Copiar endereco da imagem" poe um LINK -> tenta-se buscar e
       guardar na mesma; se o site bloquear (CORS), fica o link. */
    // TRES fotos diferentes, que nao se podem confundir:
    //   fotoAtual -> a que o produto JA tem na Prico (so para ver e comparar)
    //   fotoUrl   -> a NOVA, colada agora; e a unica que se grava
    //   fotoOff   -> a que o Open Food Facts oferece, a um clique
    let fotoUrl = null, fotoAtual = null, fotoOff = null;

    function mostrarFoto(estado){
      const temNova = !!fotoUrl, temAtual = !!fotoAtual;
      let txt = estado;
      if(!txt){
        if(temNova && temAtual) txt = '\u26a0\ufe0f A nova foto vai SUBSTITUIR a que esta na Prico.';
        else if(temNova)        txt = '\u2713 Foto pronta a guardar.';
        else if(temAtual)       txt = '\u2713 Este produto JA TEM foto. So cola outra se esta estiver ma.';
        else if(fotoOff)        txt = '\ud83d\udcf7 Sem foto na Prico \u2014 mas o Open Food Facts tem uma.';
        else                    txt = 'Sem foto. Cola aqui a da loja (Ctrl+V).';
      }
      $('fotoEstado').textContent = txt;
      // Oferta do OFF: mostra-se a foto ANTES de a aceitar (a tracejado, para
      // nao parecer ja escolhida) — senao estarias a aceitar as cegas.
      const soOferta = !temNova && !temAtual && !!fotoOff;
      if(temAtual) $('fotoAtualPrev').src = fotoAtual;
      if(temNova)  $('fotoPrev').src = fotoUrl;
      else if(soOferta) $('fotoPrev').src = fotoOff;
      $('fotoPrev').style.border = temNova ? '2px solid #16a34a' : '2px dashed #cbd5e1';
      $('fotoBoxAtual').style.display = temAtual ? 'inline-block' : 'none';
      $('fotoBoxNova').style.display  = (temNova || soOferta) ? 'inline-block' : 'none';
      $('fotoTiras').style.display    = (temAtual || temNova || soOferta) ? 'flex' : 'none';
      $('fotoNovaLegenda').style.color = soOferta ? '#64748b' : '#16a34a';
      $('fotoNovaLegenda').textContent = soOferta ? 'do Open Food Facts' : (temAtual ? 'nova (substitui)' : 'nova');
      $('fotoTirar').style.display = temNova ? 'inline-block' : 'none';
      $('fotoTirar').textContent = temAtual ? 'Cancelar \u2014 manter a atual' : 'Remover foto';
      $('fotoUsarOff').style.display = (!temNova && !temAtual && fotoOff) ? 'inline-block' : 'none';
    }

    async function enviarParaStorage(blob){
      const tipo = blob.type || 'image/png';
      const ext = (tipo.split('/')[1] || 'png').replace('jpeg','jpg').replace('+xml','');
      const nome = 'web/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + ext;
      const { error } = await sb.storage.from('product-images').upload(nome, blob, { contentType: tipo, upsert: false });
      if(error) throw error;
      return sb.storage.from('product-images').getPublicUrl(nome).data.publicUrl;
    }

    async function aoColarFoto(e){
      const itens = (e.clipboardData && e.clipboardData.items) || [];
      for(const it of itens){
        if(it.type && it.type.indexOf('image/') === 0){
          e.preventDefault();
          mostrarFoto('A enviar a imagem…');
          try{
            fotoUrl = await enviarParaStorage(it.getAsFile());
            mostrarFoto('✓ Imagem guardada na Prico.');
          }catch(err){
            fotoUrl = null;
            mostrarFoto('Não consegui guardar a imagem: ' + (err.message || err));
          }
          $('fotoCola').value='';
          return;
        }
      }
      // Sem bytes: talvez tenha sido colado o ENDERECO da imagem.
      const texto = ((e.clipboardData && e.clipboardData.getData('text')) || '').trim();
      if(/^https?:\/\//i.test(texto)){
        e.preventDefault();
        $('fotoCola').value='';
        mostrarFoto('A obter a imagem do link…');
        try{
          const r = await fetch(texto, { mode:'cors' });
          if(!r.ok) throw new Error('HTTP ' + r.status);
          const blob = await r.blob();
          if(blob.type.indexOf('image/') !== 0) throw new Error('o link não é uma imagem');
          fotoUrl = await enviarParaStorage(blob);
          mostrarFoto('✓ Imagem guardada na Prico.');
        }catch(err){
          // O site da loja bloqueou a copia -> guarda-se o link como esta.
          fotoUrl = texto;
          mostrarFoto('⚠️ Guardado como LINK do site da loja (pode deixar de funcionar).');
        }
      }
    }

    /* --- Tradutor ESPANHOL -> PORTUGUES (copia de src/lib/es-pt.ts) ---
       O OFF tem muitas vezes o nome espanhol bem mais completo que o portugues
       ("Mini" vs "Galletas con gotas de chocolate"). Traduz-se em vez de deitar
       fora o nome bom. Dicionario FECHADO de supermercado: o que nao conhece
       fica igual. Se mudares aqui, muda tambem em src/lib/es-pt.ts. */
    const TRAD_FRASES = [
  [/\baceite de oliva( virgen extra)?\b/gi, 'azeite virgem extra'],
  [/\baceite de oliva\b/gi, 'azeite'],
  [/\baceite de girasol\b/gi, 'óleo de girassol'],
  [/\bpan de molde\b/gi, 'pão de forma'],
  [/\bpan rallado\b/gi, 'pão ralado'],
  [/\bqueso para untar\b/gi, 'queijo para barrar'],
  [/\bqueso fundido\b/gi, 'queijo fundido'],
  [/\bqueso fresco\b/gi, 'queijo fresco'],
  [/\bgotas de chocolate\b/gi, 'gotas de chocolate'],
  [/\bchocolate con leche\b/gi, 'chocolate de leite'],
  [/\bleche entera\b/gi, 'leite gordo'],
  [/\bleche semidesnatada\b/gi, 'leite meio-gordo'],
  [/\bleche desnatada\b/gi, 'leite magro'],
  [/\bsin azucares? anadidos?\b/gi, 'sem açúcares adicionados'],
  [/\bsin gluten\b/gi, 'sem glúten'],
  [/\bsin lactosa\b/gi, 'sem lactose'],
  [/\bsin sal\b/gi, 'sem sal'],
  [/\bbajo en grasa\b/gi, 'baixo teor de gordura'],
  [/\bfinas lonchas\b/gi, 'fatias finas'],
  [/\ben lonchas\b/gi, 'às fatias'],
  [/\bal horno\b/gi, 'no forno'],
  [/\bal natural\b/gi, 'ao natural'],
  [/\bzumo de naranja\b/gi, 'sumo de laranja'],
  [/\bagua mineral\b/gi, 'água mineral'],
  [/\bjamon serrano\b/gi, 'presunto serrano'],
  [/\bjamon cocido\b/gi, 'fiambre'],
  [/\bjamon york\b/gi, 'fiambre'],
  [/\bpechuga de pavo\b/gi, 'peito de peru'],
  [/\bpechuga de pollo\b/gi, 'peito de frango'],
  [/\btortitas de arroz\b/gi, 'tortitas de arroz'],
  [/\bpuré de patata[s]?\b/gi, 'puré de batata'],
  [/\bcrema de cacahuete\b/gi, 'manteiga de amendoim'],
  [/\bfrutos secos\b/gi, 'frutos secos'],
  [/\bfrutos del bosque\b/gi, 'frutos silvestres'],
  [/\bfrutas del bosque\b/gi, 'frutos silvestres'],
  // --- FRANCÊS (o OFF nasceu em França e o Auchan é francês) ---
  [/\bhuile d'olive( vierge extra)?\b/gi, 'azeite virgem extra'],
  [/\bhuile de tournesol\b/gi, 'óleo de girassol'],
  [/\blait concentré( sucré)?(?![a-zà-ÿ])/gi, 'leite condensado'],
  [/\blait demi-écrémé(?![a-zà-ÿ])/gi, 'leite meio-gordo'],
  [/\blait écrémé(?![a-zà-ÿ])/gi, 'leite magro'],
  [/\blait entier\b/gi, 'leite gordo'],
  [/\byaourt nature\b/gi, 'iogurte natural'],
  [/\bfromage frais\b/gi, 'queijo fresco'],
  [/\bfromage râpé(?![a-zà-ÿ])/gi, 'queijo ralado'],
  [/\bfromage à tartiner\b/gi, 'queijo para barrar'],

    /* ---------------------------------------------------------------
       CONVENCAO UNICA DAS QUANTIDADES: "500 g", "1,5 L", "6 un", "4 x 200 ml"
       Numero, espaco, unidade em minusculas — menos o litro, que e "L"
       maiusculo para nao se confundir com o algarismo 1.

       Sem isto o catalogo enchia-se de "200g", "4x300g", "1 l" e "200 gram" —
       eram 859 produtos fora da convencao, e o pack_units saia errado (um
       "200 gram" era lido como um pacote de 200 unidades).

       As regras dificeis, que valem a pena explicar:
         "480 g (4 x 120 g)" -> "4 x 120 g"  (o parentesis e o PACK)
         "385 g (270 g)"     -> "385 g"      (o parentesis e o ESCORRIDO:
                                              fica o liquido, o de fora)
         "300 g / 291 ml"    -> "300 g"      (dupla medida: fica a primeira)
       E ha sinais que PARECEM um "x" e nao sao: o simbolo de multiplicacao (×)
       e ate um "х" cirilico, que vem copiado de sites e e indistinguivel a
       olho nu.
       --------------------------------------------------------------- */
    function normalizarQuantidade(bruto){
      let s = String(bruto||'').trim();
      if(!s) return '';
      s = s.replace(/[×хХ✕✖]/g, 'x');
      s = s
        .replace(/\bgramas?\b/gi,'g').replace(/\bgrams?\b/gi,'g').replace(/\bgr\b/gi,'g')
        .replace(/\bquilos?\b/gi,'kg').replace(/\bkgs\b/gi,'kg')
        .replace(/\blitros?\b/gi,'L').replace(/\blitres?\b/gi,'L').replace(/\blts?\b/gi,'L')
        .replace(/\bmililitros?\b/gi,'ml').replace(/\bcentilitros?\b/gi,'cl')
        .replace(/\bunidades?\b/gi,'un').replace(/\bunids?\b/gi,'un').replace(/\buns\b/gi,'un')
        .replace(/(\d)\s*u\b/gi,'$1 un');
      const par = s.match(/^(.+?)\s*\(\s*([^()]+?)\s*\)\s*$/);
      if(par) s = /[x*]/i.test(par[2]) ? par[2] : par[1];
      if(s.includes('/')) s = s.split('/')[0].trim();
      s = s.replace(/\s+/g,' ').trim();
      const m = s.match(/^(?:(\d+)\s*[x*]\s*)?(\d+(?:[.,]\d+)?)\s*(kg|mg|g|ml|cl|dl|lt|l|un)$/i);
      // Nao reconhecido -> devolve-se o que la estava. Mais vale uma
      // quantidade estranha escrita pela pessoa do que uma inventada.
      if(!m) return String(bruto||'').trim();
      const pack = m[1] ? (parseInt(m[1],10) + ' x ') : '';
      const num = m[2].replace('.', ',').replace(/,0+$/,'');
      const u = m[3].toLowerCase();
      return pack + num + ' ' + (u === 'l' || u === 'lt' ? 'L' : u);
    }

    // --- Digito de controlo do codigo de barras (apanha numeros mal copiados) ---
    function gtinChecksumOk(code){
      const d=String(code||'').replace(/\D/g,'');
      if(![8,12,13,14].includes(d.length)) return false;
      const dig=d.split('').map(Number); const check=dig.pop();
      const soma=dig.reverse().reduce((a,n,i)=>a+n*(i%2===0?3:1),0);
      return (10-(soma%10))%10===check;
    }

    /* Mesma regra da app (guessCategory em db.ts): PALAVRA INTEIRA, com plural
       e prefixo a partir de 5 letras — nunca pedaço de texto, senão
       "aguardente" caía em Águas. Expressões com espaço comparam-se inteiras. */
    function guessCategory(nome){
      const n = deburr(nome||'');
      const palavras = n.split(/[^a-z0-9]+/).filter(Boolean);
      for(const [chave,cat] of CAT_KW){
        const k = deburr(chave).trim();
        if(!k) continue;
        if(k.includes(' ')){ if(n.includes(k)) return cat; continue; }
        if(palavras.some(w => w===k || w===k+'s' || w===k+'es' || (k.length>=5 && w.startsWith(k)))) return cat;
      }
      return '';
    }
    /* CATEGORIAS-FIM */

    // --- Marcas ja existentes na base, para separar o titulo colado ---
    let MARCAS = new Set();          // marcas em minusculas, p/ separar o titulo
    let MARCAS_GRAFIA = new Map();   // chave sem pontuacao -> grafia JA usada na base
    const chaveMarca = (s) => deburr(s).replace(/[^a-z0-9]/g,'');
    async function carregarMarcas(){
      const vistas=new Set(), contagem=new Map();
      for(let f=0;;f+=1000){
        const { data } = await sb.from('products').select('brand').range(f,f+999);
        if(!data || !data.length) break;
        data.forEach(r=>{
          const b=(r.brand||'').trim(); if(!b) return;
          vistas.add(deburr(b));
          const k=chaveMarca(b); if(!k) return;
          if(!contagem.has(k)) contagem.set(k,new Map());
          const m=contagem.get(k); m.set(b,(m.get(b)||0)+1);
        });
        if(data.length<1000) break;
      }
      MARCAS = vistas;
      // Para cada marca, fica a grafia MAIS USADA na base (ja uniformizada).
      MARCAS_GRAFIA = new Map();
      for(const [k,m] of contagem){
        const melhor=[...m.entries()].sort((a,b)=>b[1]-a[1])[0][0];
        MARCAS_GRAFIA.set(k, melhor);
      }
    }

    /* Se a marca escrita ja existe na base, adota a grafia de la ("gullon" ->
       "Gullón", "coca cola" -> "Coca-Cola"). Evita criar variantes novas da
       mesma marca, que partem a pesquisa e enchem o seletor. */
    function normalizarMarca(){
      const v=$('brand').value.trim();
      if(!v) return;
      const boa=MARCAS_GRAFIA.get(chaveMarca(v));
      $('brand').value = (boa && boa!==v) ? boa : titleCasePT(v);
    }

    /* Separa um titulo copiado da loja em nome / marca / quantidade.
       Ex.: "Leite UHT Meio Gordo Mimosa 1 L" -> nome "Leite UHT Meio Gordo",
            marca "Mimosa", quantidade "1 L". A marca so e separada se JA existir
            na base (senao ficava a adivinhar). */
    function separarTitulo(t){
      let s=(t||'').replace(/\s+/g,' ').trim();
      if(!s) return null;
      s = s.replace(/\s*\d+[.,]\d{2}\s*€?\s*$/,'').trim();          // preco colado no fim
      let qty='';
      const qm = s.match(/((?:\d+\s*[x×]\s*)?\d+(?:[.,]\d+)?\s*(?:kg|gr|g|mg|ml|cl|dl|lt|l|un|unid|unidades)\b\.?)\s*$/i);
      if(qm){ qty=qm[1].replace(/\.$/,'').trim(); s=s.slice(0,qm.index).trim(); }
      let brand='';
      let palavras=s.split(' ');
      for(let n=3;n>=1;n--){                                          // marca no FIM
        if(palavras.length<=n) continue;
        const cand=palavras.slice(-n).join(' ');
        if(MARCAS.has(deburr(cand))){ brand=cand; palavras=palavras.slice(0,-n); break; }
      }
      if(!brand){
        for(let n=3;n>=1;n--){                                        // ou no INICIO
          if(palavras.length<=n) continue;
          const cand=palavras.slice(0,n).join(' ');
          if(MARCAS.has(deburr(cand))){ brand=cand; palavras=palavras.slice(n); break; }
        }
      }
      return { name: palavras.join(' ').trim(), brand, quantity: qty };
    }

    // Tenta as 3 bases abertas: comida -> beleza -> produtos gerais.
    const OFF_HOSTS = ['world.openfoodfacts.org','world.openbeautyfacts.org','world.openpetfoodfacts.org','world.openproductsfacts.org'];
    async function offHost(h, ean){
      try{
        const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),4000);
        const r=await fetch('https://'+h+'/api/v2/product/'+ean+'.json?fields=product_name,product_name_pt,product_name_es,product_name_fr,product_name_en,generic_name,generic_name_pt,generic_name_es,generic_name_fr,brands,quantity,image_front_small_url,image_front_url,image_url',{signal:ctrl.signal});
        clearTimeout(t);
        const j=await r.json();
        if(j.status===1 && j.product){ const p=j.product; const m=melhorNomeOff(p); if(m) return { name:m.nome, traduzido:m.traduzido, ingles:m.ingles, brand:(p.brands||'').split(',')[0].trim(), quantity:(p.quantity||'').trim(), image:(p.image_front_small_url||p.image_front_url||p.image_url||null) }; }
      }catch{ /* timeout/CORS/erro */ }
      return null;
    }
    // Guarda a resposta: o mesmo codigo e consultado mais do que uma vez
    // (nome melhor + foto) e nao vale a pena bater duas vezes no servidor.
    const _offCache = new Map();
    async function offLookup(ean){
      if(_offCache.has(ean)) return _offCache.get(ean);
      const res = await Promise.all(OFF_HOSTS.map(h=>offHost(h,ean)));
      const r = res.find(x=>x) || null; // prefere comida (1.ª da lista)
      _offCache.set(ean, r);
      return r;
    }

    /* Se o produto nao tem foto na Prico, oferece a do Open Food Facts. */
    async function oferecerFotoOff(ean){

    function showStatus(cls, html){ $('status').className=cls; $('status').innerHTML=html; }
    function fill(o){ $('name').value=o.name||''; $('brand').value=o.brand||''; $('qty').value=o.quantity||''; $('cat').value=o.category||'';

    const euro = (c) => (c/100).toLocaleString('pt-PT',{style:'currency',currency:'EUR'});

    async function pricesFor(productId){
      const { data } = await sb.from('prices').select('amount_cents, chains(name)').eq('product_id',productId).eq('status','official');
      if(!data || !data.length) return '<div style="margin-top:6px;color:#555">Sem preços na app ainda.</div>';
      const list = data.sort((a,b)=>a.amount_cents-b.amount_cents).map(p=>((p.chains&&p.chains.name)||'?')+' '+euro(p.amount_cents)).join(' · ');
      return '<div style="margin-top:6px;color:#555"><b>Preços na app:</b> '+list+'</div>';
    }

    async function searchByName(name){
      const words = deburr(name).split(/\s+/).filter(w=>w.length>=4).slice(0,4);
      if(!words.length) return [];
      let q = sb.from('products').select('id,name,brand,quantity,category,ean,image_url').limit(5);
      for(const w of words) q = q.ilike('search_norm','%'+w.replace(/[%,()]/g,' ')+'%');
      const { data } = await q;
      return data || [];
    }

    async function pickExisting(d){
      existing=d; fill(d);
      const pr = await pricesFor(d.id);
      showStatus('ok','✓ Selecionado: <b>'+d.name+'</b>. Ao guardar, ATUALIZA este (e cola-lhe o EAN) — sem duplicar.'+pr);
    }
    window.__pick = pickExisting;

    // Inserir SEM EAN: abre o formulário em branco. A rede anti-duplicado passa a
    // ser a procura por nome (ver onNameInput) — clica numa sugestão para atualizar.
    function manualStart(){
      existing=null; window._dups=[];
      $('ean').value='';
      fill({name:'',brand:'',quantity:'',category:''});
      showStatus('no','✍️ <b>Sem EAN.</b> Escreve o nome — procuro parecidos para não duplicares. Escolhe a cadeia e o preço e adiciona.');
      $('form').style.display='block';
      $('name').focus();

    // Enquanto escreves o NOME (e não há EAN), procura produtos parecidos. Escrever
    // = produto novo; clicar numa sugestão = atualizar o existente (sem duplicar).
    let nameT=null;
    async function onNameInput(){
      const ean=($('ean').value||'').replace(/\D/g,'');
      if(ean.length>=8) return;          // o fluxo por EAN já trata da reconciliação
      existing=null;                     // a escrever = novo (clica numa sugestão p/ atualizar)
      const name=$('name').value.trim();
      clearTimeout(nameT);
      if(name.length<4){ return; }
      nameT=setTimeout(async ()=>{
        if(($('name').value||'').trim()!==name) return; // mudou entretanto
        const dups=await searchByName(name);
        window._dups=dups;
        if(dups.length){
          const links=dups.map((d,i)=>'<a href="#" style="display:block;margin:4px 0" onclick="event.preventDefault();window.__pick(window._dups['+i+'])">'+'<b>'+d.name+'</b>'+(d.brand? ' · '+d.brand : '')+(d.quantity? ' · '+d.quantity : '')+(d.ean? '' : ' <span style=\"color:#b45309\">(sem código)</span>')+'</a>').join(' · ');
          showStatus('no','⚠️ <b>Pode já existir</b>: '+links+'<br><span style="color:#555">É um destes? Clica para atualizar. Senão, continua e adiciona como novo.</span>');
        } else {
          showStatus('no','✍️ Sem parecidos — parece novo. Confirma e adiciona.');
        }
      }, 350);
    }

    async function lookup(){
      const ean=($('ean').value||'').replace(/\D/g,'');
      existing=null; window._dups=[];
      limparSugestaoNome();
      // A foto colada NAO pode passar para o produto seguinte.
      fotoUrl=null; fotoAtual=null; fotoOff=null; mostrarFoto();
      if(ean.length<8){ showStatus('err','EAN inválido (8 a 13 dígitos).'); $('form').style.display='none'; return; }
      showStatus('ok','A procurar…');
      try {
      // 1) já existe na Prico por EAN?
      const { data: prod } = await sb.from('products').select('*').eq('ean',ean).maybeSingle();
      if(prod){
        existing=prod; fill(prod);
        const pr = await pricesFor(prod.id);
        showStatus('ok','✓ <b>Já existe na Prico</b> (por EAN): '+prod.name+'. Podes corrigir e/ou adicionar preços — atualiza, não duplica.'+pr);
        $('form').style.display='block'; $('name').focus();
        // Mesmo existindo, vale a pena perguntar ao Open Food Facts: o nome
        // guardado pode ser pior (em espanhol, ou so a variante tipo "Mini").
        proporNomeMelhor(ean, prod.name);
        if(!prod.image_url) oferecerFotoOff(ean);
        return;
      }
      // 2) sem EAN na app -> identificar nas bases abertas
      const off=await offLookup(ean);
      const offName = off ? off.name : '';
      if(off) fill({...off, category: guessCategory(off.name)});
      else fill({name:'',brand:'',quantity:'',category:''});
      if(off && off.image){ fotoOff = off.image; mostrarFoto(); }
      // 3) procurar por NOME possíveis existentes (que estejam sem EAN)
      const dups = offName ? await searchByName(offName) : [];
      if(dups.length){
        window._dups=dups;
        const links = dups.map((d,i)=>'<a href="#" style="display:block;margin:4px 0" onclick="event.preventDefault();window.__pick(window._dups['+i+'])">'+'<b>'+d.name+'</b>'+(d.brand? ' · '+d.brand : '')+(d.quantity? ' · '+d.quantity : '')+(d.ean? '' : ' <span style=\"color:#b45309\">(sem código)</span>')+'</a>').join('');
        showStatus('no', (off?('🆕 Identificado: <b>'+offName+'</b>.<br>'):'')+
          '⚠️ <b>Pode já existir</b> (sem EAN): '+links+
          '<br><span style="color:#555">Se for um destes, clica para o atualizar (cola-lhe o EAN). Senão, é mesmo novo.</span>');
      } else {
        showStatus('no', off ? ('🆕 Novo. Identificado: <b>'+offName+'</b>. Confirma e adiciona.') : '🆕 Novo (não encontrado nas bases abertas). Preenche à mão.');
      }

    }

    async function addProduct(){
      $('msg').textContent='';
      const name=fixName($('name').value);
      if(name.length<2){ $('msg').className='err2'; $('msg').textContent='Escreve o nome.'; return; }
      $('name').value=name;
      const ean=($('ean').value||'').replace(/\D/g,'')||null;
      const brand=titleCasePT($('brand').value.trim())||null;
      const quantity=normalizarQuantidade($('qty').value)||null;
      const category=$('cat').value||null;
      $('add').disabled=true;
      try{
        const wasExisting = !!existing;
        let juntouAExistente = false;
        let productId;
        if(existing){
          // Já existe -> ATUALIZA os dados (por id, sem duplicar) com o formulário.
          productId=existing.id;
          const { error: ue } = await sb.from('products').update({
            name, brand, quantity, category, ean,
            pack_units: derivePackUnits(quantity), search_norm: searchNorm(name,brand),
            // so mexe na foto se tiver sido colada uma nova (nao apaga a existente)
            ...(fotoUrl ? { image_url: fotoUrl } : {})
          }).eq('id', productId);
          if(ue) throw ue;
        }
        else {
          /*
           * UM EAN E UMA IDENTIDADE. Se o codigo nao esta na Prico, o produto e
           * NOVO e cria-se — ponto final.
           *
           * Juntar por nome aqui foi o que fez o Esparguete Auchan 500g
           * (3596710515820) desaparecer para dentro de um "Esparguete 1 kg" que
           * ja la estava: perdeu-se o codigo, a marca e a quantidade, e o preco
           * de 0,69 EUR ficou colado ao produto errado. E a mensagem ainda
           * dizia "Adicionado", por isso nao havia como dar por isso.
           *
           * A rede anti-duplicado nao e esta: e o aviso no ecra, com os
           * parecidos, onde e a PESSOA que confirma se e o mesmo produto.
           */
          let achado = null;
          if(!ean){
            // Sem codigo nao ha identidade, e ai vale a pena colar a um
            // existente — mas so se for MESMO o mesmo: nome e quantidade
            // iguais, e o outro tambem sem codigo (se tem codigo, e outro).
            const { data: match } = await sb.from('products').select('id,name,quantity,ean').ilike('name',name);
            achado = (match||[]).find(x =>
              x.name.toLowerCase()===name.toLowerCase() && !x.ean &&
              deburr(x.quantity||'') === deburr(quantity||'')) || null;
          }
          if(achado){ productId=achado.id; juntouAExistente=true; }
          else {
            const { data: created, error } = await sb.from('products').insert({
              ean, name, brand, quantity, category,
              pack_units: derivePackUnits(quantity), search_norm: searchNorm(name,brand),
              image_url: fotoUrl,
              status:'confirmed', created_by: user.id
            }).select('id').single();
            if(error) throw error; productId=created.id;
          }
        }
        // Preços/promoções de cada bloco preenchido
        let n=0, np=0;
        for(const i of [1,2,3]){
          const chainId=$('chain'+i).value;
          const cents=parsePriceToCents($('price'+i).value);
          if(!chainId || cents===null) continue;
          const { error: pe } = await sb.rpc('report_price', { p_product_id:productId, p_chain_id:chainId, p_amount_cents:cents, p_region:'nacional' });
          if(pe) throw pe; n++;
          const promoCents=parsePriceToCents($('promo'+i).value);
          if(promoCents!==null){
            const { error: pre } = await sb.rpc('report_promotion', {
              p_product_id:productId, p_chain_id:chainId, p_promo_type:'desconto_direto', p_description:null,
              p_promo_price_cents:promoCents, p_regular_price_cents:cents, p_ends_on:($('ends'+i).value||null), p_starts_on:null, p_region:'nacional'
            });
            if(pre) throw pre; np++;
          }
        }
        const extra=(n?(' · '+n+' preço'+(n>1?'s':'')):'')+(np?(' · '+np+' promo'):'');
        // Dizer a verdade: se o preco foi parar a um produto que ja la estava,
        // isso tem de aparecer, senao repete-se o erro sem se dar por ele.
        const verb = wasExisting ? 'Atualizado' : juntouAExistente ? 'Juntado a um já existente' : 'Adicionado';
        $('msg').className='ok2'; $('msg').textContent='✓ '+verb+': '+name+extra;
        const li=document.createElement('li'); li.innerHTML='✓ '+verb+': '+name+extra+(ean?' · <span class="ean">'+ean+'</span>':''); $('hist').insertBefore(li,$('hist').firstChild);
        // limpar
        $('ean').value=''; $('form').style.display='none'; $('status').className='';
        // A CADEIA fica escolhida: a seguir vem quase sempre outro produto da mesma loja.
        for(const i of [1,2,3]){ $('price'+i).value=''; $('promo'+i).value=''; $('ends'+i).value=''; }
        fotoUrl=null; fotoAtual=null; fotoOff=null; mostrarFoto(); limparSugestaoNome();
        $('titulo').value=''; $('name').value=''; $('brand').value=''; $('qty').value=''; $('cat').value='';
        existing=null; $('ean').focus();
      }catch(e){ $('msg').className='err2'; $('msg').textContent='Erro: '+(e.message||e); }
      $('add').disabled=false;
    }

    // Colar o titulo copiado da loja -> preenche os campos automaticamente.
    function aplicarTitulo(){
      const r = separarTitulo($('titulo').value);
      if(!r || !r.name) return;
      $('name').value = fixName(r.name);
      if(r.brand) $('brand').value = r.brand;
      if(r.quantity) $('qty').value = r.quantity;
      normalizarMarca();
      if(!$('cat').value){ const c = guessCategory($('name').value); if(c) $('cat').value = c; }
      $('form').style.display='block';
      $('titulo').value='';            // atalho de uma vez: o que conta e o campo Nome
      $('name').focus();
    }

    async function enterApp(){
      const { data:{ session } } = await sb.auth.getSession();
      if(!session){ $('login').style.display='block'; $('app').style.display='none'; return; }
      user=session.user;
      $('login').style.display='none'; $('app').style.display='block';
      $('who').textContent='Sessão: '+user.email;
      $('cat').innerHTML='<option value="">— categoria —</option>'+CATEGORIES.map(c=>'<option>'+c+'</option>').join('');
      carregarMarcas();
      $('titulo').addEventListener('paste', ()=>setTimeout(aplicarTitulo,0));
      $('brand').addEventListener('blur', normalizarMarca);
      $('fotoCola').addEventListener('paste', aoColarFoto);
      // Normaliza assim que se sai do campo: a pessoa ve logo o formato final
      // em vez de descobrir depois que ficou diferente do que escreveu.
      $('qty').addEventListener('blur', ()=>{
        const antes = $('qty').value;
        const depois = normalizarQuantidade(antes);
        if(depois !== antes.trim()) $('qty').value = depois;
      });
      $('fotoTirar').addEventListener('click', ()=>{ fotoUrl=null; mostrarFoto(); });
      $('fotoUsarOff').addEventListener('click', ()=>{
        if(!fotoOff) return;
        fotoUrl = fotoOff;
        mostrarFoto('\u2713 Foto do Open Food Facts escolhida.');
      });
      $('titulo').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); aplicarTitulo(); } });
      // Aviso (nao bloqueia) quando o codigo colado nao bate certo
      $('ean').addEventListener('input', ()=>{
        const d=$('ean').value.replace(/[^0-9]/g,'');
        const av=$('eanAviso');
        if(!av) return;
        av.style.display = ([8,12,13,14].includes(d.length) && !gtinChecksumOk(d)) ? 'block' : 'none';
      });
      const { data:ch } = await sb.from('chains').select('id,name').order('name');
      chains=ch||[];
      const opts='<option value="">— sem cadeia —</option>'+chains.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('');
      document.querySelectorAll('.chainsel').forEach(s=>{ s.innerHTML=opts; });
      $('ean').focus();
    }

    $('entrar').addEventListener('click', async ()=>{
      $('loginErr').textContent='';
      const { error } = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('pass').value });
      if(error){ $('loginErr').textContent='Login falhou: '+error.message; return; }
      enterApp();
    });
    $('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') $('entrar').click(); });
    $('sair').addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });
    $('ean').addEventListener('keydown', e=>{ if(e.key==='Enter') lookup(); });
    $('semEan').addEventListener('click', manualStart);
    $('name').addEventListener('input', onNameInput);
    $('name').addEventListener('blur', ()=>{ $('name').value = fixName($('name').value); });
    $('brand').addEventListener('blur', ()=>{ $('brand').value = titleCasePT($('brand').value); });
    $('name').addEventListener('paste', ()=> setTimeout(()=>{ $('name').value = fixName($('name').value); }, 0));
    $('brand').addEventListener('paste', ()=> setTimeout(()=>{ $('brand').value = titleCasePT($('brand').value); }, 0));
    $('add').addEventListener('click', addProduct);

    enterApp();
  </script>
</body>
</html>
